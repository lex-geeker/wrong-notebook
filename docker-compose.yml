services:
  wrong-notebook:
    build:
      context: .
      network: host
    container_name: wrong-notebook
    restart: always
    ports:
      - "3001:3000"
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      AUTH_TRUST_HOST: "true"
    volumes:
      # Persist the SQLite database
      - ./data:/app/data
      - ./config:/app/config
